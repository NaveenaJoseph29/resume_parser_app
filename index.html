<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume Parser | Match your resume to a job description</title>

    <!-- Tailwind CSS (Play CDN: no build step needed for learning) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Theme palette: each colour is a CSS variable, so switching theme only swaps the values below.
         Values are "R G B" triplets so Tailwind's opacity modifiers (bg-accent/10) still work. -->
    <style>
      :root {
        --page: 243 235 220;
        --surface: 250 245 234;
        --line: 207 194 168;
        --line-strong: 140 129 112;
        --track: 230 220 200;
        --ink: 15 14 12;
        --muted: 92 86 73;
        --faint: 138 130 115;
        --accent: 196 69 15;
        --accent-hover: 163 53 8;
        --on-accent: 250 245 234;
        --good: 46 107 46;
        --warn: 150 96 0;
        --bad: 166 30 30;
      }
      .dark {
        --page: 15 14 12;
        --surface: 23 21 18;
        --line: 46 42 36;
        --line-strong: 90 83 71;
        --track: 42 38 32;
        --ink: 245 236 217;
        --muted: 181 172 152;
        --faint: 125 118 102;
        --accent: 255 122 46;
        --accent-hover: 255 154 92;
        --on-accent: 15 14 12;
        --good: 125 201 120;
        --warn: 230 180 70;
        --bad: 240 110 100;
      }
      /* Highlighter stroke for matched terms, and a dashed underline for missing ones.
         The stroke sweeps in once when results arrive; reduced-motion users get it at once. */
      .hl {
        background-image: linear-gradient(rgb(var(--accent) / 0.35), rgb(var(--accent) / 0.35));
        background-repeat: no-repeat;
        background-position: 0 85%;
        background-size: 100% 42%;
        animation: hl-sweep 700ms ease-out both;
      }
      @keyframes hl-sweep {
        from { background-size: 0% 42%; }
      }
      .miss {
        text-decoration: underline dashed rgb(var(--bad));
        text-decoration-thickness: 2px;
        text-underline-offset: 4px;
      }
      @media (prefers-reduced-motion: reduce) {
        .hl { animation: none; }
      }
    </style>
    <script>
      // Apply the saved theme before the page paints, so there is no flash of the wrong one.
      document.documentElement.classList.toggle(
        "dark",
        (localStorage.getItem("theme") || "dark") === "dark"
      );
    </script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['"Instrument Serif"', "Georgia", "serif"],
              sans: ['"Hanken Grotesk"', "system-ui", "sans-serif"],
            },
            colors: {
              page: "rgb(var(--page) / <alpha-value>)",
              surface: "rgb(var(--surface) / <alpha-value>)",
              line: "rgb(var(--line) / <alpha-value>)",
              "line-strong": "rgb(var(--line-strong) / <alpha-value>)",
              track: "rgb(var(--track) / <alpha-value>)",
              ink: "rgb(var(--ink) / <alpha-value>)",
              muted: "rgb(var(--muted) / <alpha-value>)",
              faint: "rgb(var(--faint) / <alpha-value>)",
              accent: "rgb(var(--accent) / <alpha-value>)",
              "accent-hover": "rgb(var(--accent-hover) / <alpha-value>)",
              "on-accent": "rgb(var(--on-accent) / <alpha-value>)",
              good: "rgb(var(--good) / <alpha-value>)",
              warn: "rgb(var(--warn) / <alpha-value>)",
              bad: "rgb(var(--bad) / <alpha-value>)",
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-page text-ink font-sans transition-colors">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
